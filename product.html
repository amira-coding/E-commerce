<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Details - RK Trends</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet"/>
  <style>
    .font-hand {
      font-family: 'Patrick Hand', cursive;
    }
  </style>
</head>

<body class="container mx-auto bg-white">
<header class="fixed top-0 left-0 right-0 z-50 container mx-auto px-4">
  <div class="relative">
    <input type="checkbox" id="menu-toggle" class="hidden peer" />

    <nav class="flex justify-between items-center p-4 bg-gray-200/30 rounded-2xl mt-2 backdrop-blur-md">
      <div class="logo">
        <h1 class="text-5xl text-black font-hand">
          RK <span class="text-amber-500">Trends</span>
        </h1>
      </div>

      <div class="hidden md:flex space-x-10 text-black font-semibold text-xl">
        <a href="./index.html" class="hover:text-amber-500 transition">Home</a>
        <a href="/women.html" class="hover:text-amber-500 transition">Women</a>
        <a href="/men.html" class="hover:text-amber-500 transition">Men</a>
        <a href="/kids.html" class="hover:text-amber-500 transition">Electronics</a>
        <a href="/contact.html" class="hover:text-amber-500 transition">Contact</a>
      </div>

      <div class="hidden md:flex space-x-4 text-black text-2xl">
      <a href="favorites.html" class="relative text-2xl text-red-700 hover:-translate-y-1 transition">
        <i class="fa-solid fa-heart"></i>
      </a>
        <a href="cart.html" class="relative hover:-translate-y-1 transition">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </a>
        <i class="fa-solid fa-user hover:-translate-y-1 transition"></i>
      </div>

      <label for="menu-toggle" class="md:hidden text-black text-3xl cursor-pointer z-50">
        <i class="fa-solid fa-bars"></i>
      </label>
    </nav>

    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 peer-checked:opacity-100 peer-checked:pointer-events-auto md:hidden z-40"></div>

    <div class="fixed top-0 right-0 w-3/4 max-w-xs h-full bg-amber-600 text-black shadow-lg translate-x-full transition-transform duration-300 peer-checked:translate-x-0 md:hidden rounded-l-2xl z-50">
      <div class="flex justify-end p-4">
        <label for="menu-toggle" class="text-3xl text-black cursor-pointer">
          <i class="fa-solid fa-times"></i>
        </label>
      </div>
      <nav class="flex flex-col space-y-6 px-6 text-xl font-semibold">
        <a href="./index.html" class="hover:text-gray-800">Home</a>
        <a href="/women.html" class="hover:text-gray-800">Women</a>
        <a href="/men.html" class="hover:text-gray-800">Men</a>
        <a href="/kids.html" class="hover:text-gray-800">Electronics</a>
        <a href="/contact.html" class="hover:text-gray-800">Contact</a>
      </nav>
    </div>
  </div>
</header>

<div class="max-w-4xl mx-auto p-6 bg-white shadow-md mt-10 rounded- pt-20" id="product-details"></div>

<script>
  window.scrollTo(0, 0); // scroll to top on load

  const path = window.location.href;
  const id = path.split('=')[1];
  const container = document.getElementById('product-details');

  fetch("https://fakestoreapi.com/products/" + id)
    .then(res => res.json())
    .then(data => {
      container.innerHTML = `
        <div class="flex flex-col md:flex-row gap-10">
          <img src="${data.image}" alt="${data.title}" class="w-full md:w-1/2 object-cover rounded-lg">
          <div class="flex-1 space-y-4">
            <h1 class="text-3xl font-bold">${data.title}</h1>
            <p class="text-sm text-gray-500">${data.category}</p>
            <p class="text-lg text-gray-700">${data.description}</p>
            <div class="flex items-center gap-4">
              <span class="text-2xl font-bold text-amber-600">$${data.price}</span>
              <span class="text-yellow-500">
                ${'★'.repeat(Math.floor(data.rating?.rate || 5))}
                <span class="text-sm text-gray-500">(${data.rating.count} reviews)</span>
              </span>
            </div>
            <button id="buyBtn" class="bg-amber-500 text-black px-6 py-3 rounded hover:bg-amber-600 transition">
              Add to Cart
            </button>
          </div>
        </div>
      `;

      document.getElementById('buyBtn').addEventListener('click', () => {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const existingItem = cart.find(item => item.id === data.id);
        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          cart.push({
            id: data.id,
            title: data.title,
            price: data.price,
            image: data.image,
            quantity: 1
          });
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        window.location.href = 'cart.html';
      });
    })
    .catch(error => {
      console.error(error);
      container.innerHTML = '<p class="text-red-500">Failed to load product details.</p>';
    });

  // Update cart count in navbar
  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartCountElement = document.getElementById('cart-count');
    if (cartCountElement) {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountElement.textContent = totalItems;
    }
  }
  updateCartCount();
</script>

</body>
</html>
