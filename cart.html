<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RK Trends</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
  <style>
    .logo {
      font-family: 'Patrick Hand', cursive;
    }
  </style>
</head>

<body class="container mx-auto bg-white">

<header class="fixed top-0 left-0 right-0 z-50 container mx-auto px-4">
  <div class="relative">
    <input type="checkbox" id="menu-toggle" class="hidden peer" />

    <nav class="flex justify-between items-center p-4 bg-gray-200/30 rounded-2xl mt-2 backdrop-blur-md">
      <div class="logo">
        <h1 class="text-5xl text-black font-hand">RK <span class="text-amber-500">Trends</span></h1>
      </div>

      <div class="hidden md:flex space-x-10 text-black font-semibold text-xl">
        <a href="./index.html" class="hover:text-amber-500 transition">Home</a>
        <a href="/women.html" class="hover:text-amber-500 transition">Women</a>
        <a href="/men.html" class="hover:text-amber-500 transition">Men</a>
        <a href="/kids.html" class="hover:text-amber-500 transition">Electronics</a>
        <a href="/contact.html" class="hover:text-amber-500 transition">Contact</a>
      </div>

      <div class="hidden md:flex space-x-4 text-black text-2xl">
        <i class="fa-regular fa-heart text-red-700 hover:-translate-y-1 transition"></i>
        <a href="cart.html" class="relative hover:-translate-y-1 transition">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </a>
        <i class="fa-solid fa-user hover:-translate-y-1 transition"></i>
      </div>

      <label for="menu-toggle" class="md:hidden text-black text-3xl cursor-pointer z-50">
        <i class="fa-solid fa-bars"></i>
      </label>
    </nav>

    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 peer-checked:opacity-100 peer-checked:pointer-events-auto md:hidden z-40"></div>

    <div class="fixed top-0 right-0 w-3/4 max-w-xs h-full bg-amber-600 text-black shadow-lg translate-x-full transition-transform duration-300 peer-checked:translate-x-0 md:hidden rounded-l-2xl z-50">
      <div class="flex justify-end p-4">
        <label for="menu-toggle" class="text-3xl text-black cursor-pointer">
          <i class="fa-solid fa-times"></i>
        </label>
      </div>
      <nav class="flex flex-col space-y-6 px-6 text-xl font-semibold">
        <a href="./index.html" class="hover:text-gray-800">Home</a>
        <a href="/women.html" class="hover:text-gray-800">Women</a>
        <a href="/men.html" class="hover:text-gray-800">Men</a>
        <a href="/kids.html" class="hover:text-gray-800">Electronics</a>
        <a href="/contact.html" class="hover:text-gray-800">Contact</a>
      </nav>
    </div>
  </div>
</header>

<main class="pt-28 px-4 md:px-8 max-w-5xl mx-auto">
  <div id="cart-items" class="space-y-6"></div>

  <div class="mt-10 p-6 bg-white rounded-xl shadow flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="text-xl font-semibold">
      Total: <span class="text-amber-600 text-2xl font-bold">$<span id="total-price">0</span></span>
    </div>
    <div class="space-x-4">
      <a href="index.html" class="bg-gray-200 text-gray-800 px-6 py-2 rounded hover:bg-gray-300 transition">
        ← Continue Shopping
      </a>
    </div>
  </div>
</main>

<script>
  const cartItemsContainer = document.getElementById('cart-items');
  const totalPriceElement = document.getElementById('total-price');
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function renderCart() {
    cartItemsContainer.innerHTML = '';
    let total = 0;

    if (cart.length === 0) {
      cartItemsContainer.innerHTML = `
        <div class="bg-white p-8 rounded-xl shadow text-center">
          <p class="text-gray-500 text-lg">Your cart is empty 😢</p>
          <a href="index.html" class="mt-4 inline-block bg-amber-500 text-white px-6 py-2 rounded hover:bg-amber-600 transition">
            Go Shopping
          </a>
        </div>`;
      totalPriceElement.textContent = '0';
      return;
    }

    cart.forEach((item, index) => {
      total += item.price * (item.quantity || 1);

      const itemDiv = document.createElement('div');
      itemDiv.className = "bg-white rounded-xl shadow p-4 flex flex-col md:flex-row items-center justify-between gap-4";

      itemDiv.innerHTML = `
        <div class="flex items-center gap-4 w-full md:w-auto">
          <img src="${item.image}" alt="${item.title}" class="w-24 h-24 object-contain rounded-lg" />
          <div>
            <h2 class="text-lg font-bold">${item.title}</h2>
            <p class="text-gray-600">$${item.price} × ${item.quantity || 1}</p>
          </div>
        </div>
        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 transition">
          <i class="fa-solid fa-trash"></i> Remove
        </button>
      `;

      cartItemsContainer.appendChild(itemDiv);
    });

    totalPriceElement.textContent = total.toFixed(2);
  }

  function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartCount();
  }

  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const cartCountElement = document.getElementById('cart-count');
    if (cartCountElement) {
      cartCountElement.textContent = totalItems;
    }
  }

  renderCart();
  updateCartCount();
</script>

</body>
</html>
