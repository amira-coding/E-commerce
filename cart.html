    const container = document.getElementById('container');
const storage = JSON.parse(localStorage.getItem('cart')) || [];

container.innerHTML = ''; // Clear before adding

storage.forEach((product, index) => {
  const div = document.createElement('div');
  div.className = "flex items-center gap-6 p-4 border rounded-lg shadow";

  div.innerHTML = `
    <img src="${product.image}" alt="${product.title}" class="w-32 h-32 object-contain rounded-lg" />
    <div class="flex-1">
      <h2 class="text-xl font-semibold">${product.title}</h2>
    </div>
    <button 
      class="text-red-600 text-2xl font-bold hover:text-red-800"
      aria-label="Remove item"
      onclick="removeItem(${index})"
    >
      &times;
    </button>
  `;

  container.appendChild(div);
});

// Function to remove an item by index and update localStorage + UI
function removeItem(index) {
  storage.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(storage));
  location.reload(); // reload page to update UI simply
}

  </script>
