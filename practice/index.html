<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practice</title>
  <style>
    section{
      margin: 0 auto;
      max-width: 1300px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 0 10px ;
      width: 100%;
      height: 100%;
    }
    #product-container {
      display: grid;
      grid-template-columns: repeat(4, 2fr);
      grid-template-rows: repeat(2, 1fr);
      grid-gap: 20px;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }
    .product{
      background-color: azure;
      padding: 30px 10px;
    }
    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <section>
    <div id="product-container">
 
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
